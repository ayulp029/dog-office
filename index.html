<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>狗狗虛擬辦公室</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<!-- Three.js 放在 lib/，用 import map 以相對路徑載入；執行時不靠 CDN、沒有建置步驟 -->
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<div id="hud">
  <div id="title">🐾 <span id="office-name">狗狗虛擬辦公室</span></div>
  <div id="clock"><span id="clock-time">--:--</span><span id="clock-upd"></span></div>
</div>
<div id="foot">
  <div id="demo-note" hidden>目前用示範資料</div>
  <div id="hint">拖曳旋轉・滾輪或雙指縮放・點狗狗看詳情</div>
  <button id="reset-view" type="button">重設視角</button>
</div>
<div id="debug" hidden></div>
<div id="loading">辦公室準備中…</div>
<aside id="card" hidden role="dialog" aria-live="polite">
  <button id="card-close" aria-label="關閉">×</button>
  <div id="card-body"></div>
</aside>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
